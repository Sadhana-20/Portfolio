<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Form</title>
        <style>
            body{
                background-color: white;
                color: black;
            }
            .dark{
                background-color: black;
                color: white;
            }
        </style>
    </head>
    <body>
        <button id="theme">Change Theme</button>
        <script>

            var boolean = false;
            const button = document.getElementById('theme');
            button.addEventListener('click',function(){
                boolean = !boolean;
                document.body.className=boolean?'dark':'';
                button.textContent=boolean?'Light Theme':'Dark Theme';
            });



        </script>
    </body>
</html>
